<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Apostas Live</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">⚽</div>
      <div>
        <div class="title">Apostas Live</div>
        <div class="subtitle">Ao vivo • Pré-jogo • Múltiplas • Banca</div>
      </div>
    </div>

    <div class="topbar-right">
      <div class="pill" id="bankPill">Banca: €<span id="bankAmount">1000.00</span></div>
      <button class="btn ghost" id="btnRefresh">Atualizar</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <nav class="tabs">
        <button class="tab active" data-tab="live">Ao Vivo</button>
        <button class="tab" data-tab="pre">Pré-Jogo</button>
        <button class="tab" data-tab="multis">Múltiplas</button>
        <button class="tab" data-tab="bank">Banca</button>
      </nav>

      <div class="toolbar">
        <div class="field">
          <label>Filtro</label>
          <input id="txtFilter" placeholder="liga / equipa (ex: Benfica)" />
        </div>

        <div class="field">
          <label>Ordenar</label>
          <select id="selSort">
            <option value="time">Hora</option>
            <option value="league">Liga</option>
            <option value="edge">Melhor aposta</option>
          </select>
        </div>

        <div class="field">
          <label>Odds (simuladas)</label>
          <select id="selOddsMode">
            <option value="api">Da API (se existir)</option>
            <option value="sim">Simular odds (para testar)</option>
          </select>
        </div>
      </div>

      <!-- LISTA -->
      <div id="list" class="list"></div>
    </section>

    <!-- DETALHE DO JOGO -->
    <aside class="detail" id="detail">
      <div class="detail-header">
        <div class="detail-title" id="detailTitle">Seleciona um jogo</div>
        <button class="btn ghost" id="btnCloseDetail">Fechar</button>
      </div>

      <div class="detail-body" id="detailBody">
        <div class="hint">
          Clica num jogo para abrir detalhes, estatísticas e prognósticos.
        </div>
      </div>
    </aside>
  </main>

  <!-- BETSLIP -->
  <footer class="betslip">
    <div class="betslip-left">
      <div class="betslip-title">Boletim</div>
      <div class="betslip-sub" id="slipCount">0 seleções</div>
    </div>

    <div class="betslip-center" id="slipItems"></div>

    <div class="betslip-right">
      <div class="stake">
        <label>Stake (€)</label>
        <input id="stakeInput" type="number" min="1" step="1" value="10" />
      </div>

      <div class="totals">
        <div>Total odds: <b id="totalOdds">1.00</b></div>
        <div>Retorno (est.): <b>€<span id="estReturn">0.00</span></b></div>
      </div>

      <button class="btn primary" id="btnPlace">Registar aposta</button>
    </div>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
