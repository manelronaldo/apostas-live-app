<script>
  const WORKER_URL = "https://apostas-live-api.manelronaldo1.workers.dev/";

  function esc(s) {
    return String(s ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function renderErro(msg, extra) {
    const jogosDiv = document.getElementById("jogos");
    jogosDiv.innerHTML = `
      <div style="color:#b00020;white-space:pre-wrap;border:1px solid #f2c2c2;background:#fff5f5;padding:10px;border-radius:10px">
        ${esc(msg)}
        ${extra ? "\n\n" + esc(extra) : ""}
      </div>
    `;
  }

  function renderJogos(data) {
    const jogosDiv = document.getElementById("jogos");
    const jogos = data?.results || [];
    const count = data?.count ?? jogos.length;

    if (!jogos.length) {
      jogosDiv.innerHTML = `<p>Sem jogos ao vivo agora. (count: ${esc(count)})</p>`;
      return;
    }

    jogosDiv.innerHTML = `
      <div style="margin-bottom:10px;opacity:.8">Jogos encontrados: <b>${esc(count)}</b></div>
      ${jogos
        .map((j) => {
          const liga = j?.league_name || "Liga";
          const pais = j?.country?.name ? ` (${j.country.name})` : "";
          const casa = j?.teams?.home?.name || "Casa";
          const fora = j?.teams?.away?.name || "Fora";
          const minuto = j?.minute ?? "-";
          const status = j?.status || "";
          const gc = j?.goals?.home_goals ?? "-";
          const gf = j?.goals?.away_goals ?? "-";
          const hora = j?.time ? ` • ${j.time}` : "";

          return `
            <div style="border:1px solid #ddd;padding:10px;margin:8px 0;border-radius:10px">
              <div style="font-weight:700">${esc(liga)}${esc(pais)}</div>
              <div style="margin-top:4px">${esc(casa)} <b>${esc(gc)} - ${esc(gf)}</b> ${esc(fora)}</div>
              <div style="opacity:.7;margin-top:4px">Minuto: ${esc(minuto)} ${status ? " • " + esc(status) : ""}${esc(hora)}</div>
            </div>
          `;
        })
        .join("")}
    `;
  }

  async function carregarAoVivo() {
    const jogosDiv = document.getElementById("jogos");
    jogosDiv.innerHTML = "<p>A carregar jogos ao vivo...</p>";

    try {
      const r = await fetch(WORKER_URL, { cache: "no-store" });
      const text = await r.text();

      // tenta parsear JSON
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        renderErro("Resposta não é JSON (provável erro do endpoint).", text.slice(0, 800));
        return;
      }

      if (!r.ok) {
        renderErro(`Erro HTTP ${r.status}`, JSON.stringify(data, null, 2));
        return;
      }

      renderJogos(data);
    } catch (e) {
      renderErro("Falha a fazer fetch ao Worker.", String(e?.message || e));
    }
  }

  // Liga ao botão
  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("btnCarregar");
    if (!btn) {
      renderErro('Falta o botão com id="btnCarregar" no HTML.', 'Cria: <button id="btnCarregar">Carregar</button>');
      return;
    }

    btn.addEventListener("click", carregarAoVivo);

    // carrega logo ao abrir
    carregarAoVivo();

    // auto-refresh (30s)
    setInterval(carregarAoVivo, 30000);
  });
</script>
