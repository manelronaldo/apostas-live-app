<!DOCTYPE html>
<html>
<head>
  <title>Apostas Live</title>
</head>
<body>

  <h1>Jogos ao Vivo</h1>
  <button onclick="carregarJogos()">Ver Jogos</button>
  <div id="jogos"></div>

  <script>
    async function carregarJogos() {
      const resposta = await fetch("https://api.football-data.org/v4/matches", {
        headers: {
          "X-Auth-Token": "32ef306218be45adcdb0932acf553c2535d7b055"
        }
      });

      const dados = await resposta.json();
      const div = document.getElementById("jogos");
      div.innerHTML = "";

      dados.matches.slice(0, 10).forEach(jogo => {
        div.innerHTML += `
          <p>
            ${jogo.homeTeam.name} vs ${jogo.awayTeam.name}
          </p>
        `;
      });
    }
  </script>

</body>
</html>
