<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📊 Apostas Manual + Jogos SportMonks</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:Arial,sans-serif;margin:0;padding:20px;}
h1{text-align:center;margin-bottom:15px;}
button{padding:8px 14px;border:none;border-radius:6px;background:#3498db;color:#fff;font-size:16px;cursor:pointer;margin:0 5px;}
.card{background:#1f1f1f;padding:12px;margin-top:8px;border-radius:8px;}
input,select{padding:8px;border-radius:6px;border:none;margin-top:8px;width:calc(100%-16px);}
label{font-size:14px;display:block;margin-top:8px;}
#detailPanel{display:none;}
.feedback{margin-top:10px;font-size:18px;font-weight:bold;}
.blue{color:#3498db;} .green{color:#2ecc71;} .yellow{color:#f1c40f;} .red{color:#e74c3c;}
</style>
</head>
<body>

<h1>📅 Jogos de Futebol – Insere Odds Manualmente</h1>
<div id="games"></div>

<div id="detailPanel">
  <button onclick="closeDetail()">🔙 Voltar</button>
  <div id="detail"></div>
</div>

<script>
// ➤ Teu token API SportMonks
const API_TOKEN = "dpobMmoPahBz9cdt3I4WVTZlqCwty9jEeEoT1UGRM2WRMab9fs912dBi89aM";

// Formatar data atual YYYY-MM-DD para fixtures
function getToday(){
  const d = new Date();
  return d.toISOString().split('T')[0];
}

// Buscar os jogos (fixtures) do dia
async function fetchFixtures(){
  const date = getToday();
  document.getElementById("detailPanel").style.display = "none";
  document.getElementById("games").innerHTML = "<p>Carregando jogos...</p>";
  try{
    const url = `https://api.sportmonks.com/v3/football/fixtures/date/${date}?api_token=${API_TOKEN}`;
    const res = await fetch(url);
    const data = await res.json();
    const fixtures = data.data || [];
    showGames(fixtures);
  }catch(e){
    document.getElementById("games").innerHTML = "<p>Erro ao carregar jogos</p>";
    console.error(e);
  }
}

// Mostrar a lista de jogos mesmo sem odds
function showGames(fixtures){
  const container = document.getElementById("games");
  container.innerHTML = "";
  if(!fixtures || fixtures.length === 0){
    container.innerHTML = "<p>Sem jogos hoje.</p>";
    return;
  }
  fixtures.forEach(game => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <strong>${game.name}</strong><br>
      🕒 ${game.starting_at}
      <button onclick="showDetail(${game.id}, '${game.name}')">Inserir Odds</button>
    `;
    container.appendChild(card);
  });
}

// Mostrar painel de detalhe com formulário de odd manual
function showDetail(id, name){
  document.getElementById("games").innerHTML = "";
  document.getElementById("detailPanel").style.display = "block";
  document.getElementById("detail").innerHTML = `
    <h2>${name}</h2>
    <label>Descrição do mercado (ex: +1 gol, Over 2.5):</label>
    <input id="marketDesc" type="text" placeholder="Ex: +1 gol">

    <label>Insere a odd decimal:</label>
    <input id="manualOdd" type="number" step="0.01" placeholder="Ex: 1.50">

    <button onclick="analyzeOdd()">📊 Analisar Odd</button>
    <div id="analysisResult"></div>
  `;
}

// Fechar detalhe e voltar
function closeDetail(){
  document.getElementById("detailPanel").style.display = "none";
  fetchFixtures();
}

// Analisar a odd manual que o utilizador introduziu
function analyzeOdd(){
  const oddStr = document.getElementById("manualOdd").value;
  const market = document.getElementById("marketDesc").value.trim() || "mercado";
  const resultEl = document.getElementById("analysisResult");
  const odd = parseFloat(oddStr);

  if(!odd || odd <= 1){
    resultEl.innerHTML = `<p class="red">⚠️ Introduz uma odd válida.</p>`;
    return;
  }

  // Calcular probabilidade implícita
  const implied = (1 / odd) * 100;

  let text = `<p>📈 Probabilidade implícita para <strong>${market}</strong>: <strong>${implied.toFixed(2)}%</strong></p>`;

  // Base fixa simples (50%)
  const base = 50;
  if(implied > base) text += `<p class="green">🟢 Probabilidade implícita acima da base (${base}%) → potencial valor</p>`;
  else if(implied == base) text += `<p class="yellow">🟡 Igual à base (${base}%) → cautela</p>`;
  else text += `<p class="red">🔴 Abaixo da base (${base}%) → não compensa</p>`;

  resultEl.innerHTML = text;
}

fetchFixtures();
</script>

</body>
</html>
