<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>⚽ Live + Próximos Jogos com Odds</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    padding: 20px;
  }
  h1 { text-align: center; margin-bottom: 20px; }
  h2 { margin-top: 30px; }
  .game {
    background: #fff;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 8px;
    box-shadow: 0px 2px 5px rgba(0,0,0,0.15);
  }
  .controls input, .controls select {
    padding: 6px;
    margin-right: 6px;
    border-radius: 4px;
    border: 1px solid #ccc;
  }
  .controls button {
    padding: 6px 12px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .controls button:hover { background: #218838; }
  .result { margin-top: 8px; font-weight: bold; }
</style>
</head>
<body>

<h1>⚽ Jogos Ao Vivo & Agendados</h1>

<div>
  <h2>🔴 Jogos Ao Vivo Agora</h2>
  <div id="live-games">🔄 Carregando ao vivo...</div>
</div>

<div>
  <h2>📅 Jogos Programados (Hoje)</h2>
  <div id="today-games">🔄 Carregando próximos jogos...</div>
</div>

<script>
  const API_TOKEN = "dpobMmoPahBz9cdt3I4WVTZlqCwty9jEeEoT1UGRM2WRMab9fs912dBi89aM";

  // Carrega jogos ao vivo
  async function loadLiveGames() {
    const liveContainer = document.getElementById("live-games");
    liveContainer.innerHTML = "🔄 A carregar jogos ao vivo...";
    try {
      const res = await fetch(`https://api.sportmonks.com/v3/football/livescores/inplay?api_token=${API_TOKEN}`);
      const json = await res.json();
      const games = json.data || [];

      if (games.length === 0) {
        liveContainer.innerHTML = "📍 Não há jogos ao vivo neste momento.";
        return;
      }

      liveContainer.innerHTML = "";
      games.forEach(game => {
        const div = document.createElement("div");
        div.className = "game";
        div.innerHTML = `
          <strong>${game.name}</strong><br>
          🕒 ${new Date(game.starting_at).toLocaleString()}<br>
          <div class="controls">
            Odd: <input type="number" step="0.01" id="odd-live-${game.id}" placeholder="Ex: 1.50">
            Mercado:
            <select id="market-live-${game.id}">
              <option value="+1">+1 golo</option>
              <option value="-1">-1 golo</option>
              <option value="over2.5">Over 2.5</option>
              <option value="btts">BTTS</option>
            </select>
            <button onclick="analyzeOdd('live-${game.id}')">Analisar</button>
          </div>
          <div id="result-live-${game.id}" class="result"></div>
        `;
        liveContainer.appendChild(div);
      });
    } catch (err) {
      liveContainer.innerHTML = "⚠️ Erro ao carregar jogos ao vivo.";
      console.error(err);
    }
  }

  // Carrega jogos programados para hoje
  async function loadTodayGames() {
    const todayContainer = document.getElementById("today-games");
    todayContainer.innerHTML = "🔄 A carregar jogos agendados...";
    const date = new Date().toISOString().split("T")[0];

    try {
      const res = await fetch(`https://api.sportmonks.com/v3/football/fixtures/date/${date}?api_token=${API_TOKEN}`);
      const json = await res.json();
      const games = json.data || [];

      if (games.length === 0) {
        todayContainer.innerHTML = "📍 Não há jogos agendados hoje.";
        return;
      }

      todayContainer.innerHTML = "";
      games.forEach(game => {
        const div = document.createElement("div");
        div.className = "game";
        div.innerHTML = `
          <strong>${game.name}</strong><br>
          🕒 ${new Date(game.starting_at).toLocaleString()}<br>
          <div class="controls">
            Odd: <input type="number" step="0.01" id="odd-${game.id}" placeholder="Ex: 1.50">
            Mercado:
            <select id="market-${game.id}">
              <option value="+1">+1 golo</option>
              <option value="-1">-1 golo</option>
              <option value="over2.5">Over 2.5</option>
              <option value="btts">BTTS</option>
            </select>
            <button onclick="analyzeOdd('${game.id}')">Analisar</button>
          </div>
          <div id="result-${game.id}" class="result"></div>
        `;
        todayContainer.appendChild(div);
      });
    } catch (err) {
      todayContainer.innerHTML = "⚠️ Erro ao carregar jogos agendados.";
      console.error(err);
    }
  }

  // Analisar odd e mercado
  function analyzeOdd(key) {
    const oddInput = document.getElementById(`odd-${key}`) || document.getElementById(`odd-live-${key}`);
    const marketSelect = document.getElementById(`market-${key}`) || document.getElementById(`market-live-${key}`);
    const resultDiv = document.getElementById(`result-${key}`) || document.getElementById(`result-live-${key}`);

    const odd = parseFloat(oddInput.value);
    const market = marketSelect.value;

    if (!odd || odd <= 1) {
      resultDiv.innerHTML = `<span style="color:#c00;">⚠️ Introduz uma odd válida (ex: 1.50)</span>`;
      return;
    }

    const implied = ((1 / odd) * 100).toFixed(2);

    let message = `📊 Probabilidade implícita: <strong>${implied}%</strong><br>`;
    message += `Mercado: <strong>${market}</strong><br>`;

    // lógica simples de valor
    if (implied >= 50) message += `<span style="color:green;">🟢 Pode compensar</span>`;
    else message += `<span style="color:red;">🔴 Não compensa</span>`;

    resultDiv.innerHTML = message;
  }

  // Inicializar
  loadLiveGames();
  loadTodayGames();

  // Atualizar ao vivo com intervalo
  setInterval(loadLiveGames, 15000); // atualiza ao vivo a cada 15s
</script>

</body>
</html>
